<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Crystal Remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="remote">
    <header class="top">
      <button class="power" data-key="KEY_POWER" aria-label="Power">⏻</button>
      <div class="drag"></div>
      <button class="icon" id="search">⌕</button>
      <button class="icon" id="more">⋮</button>
    </header>

    <section class="apps">
      <button class="app netflix" data-app="Netflix">NETFLIX</button>
      <button class="app active" data-app="TV Plus">Samsung<br><span>TV Plus</span></button>
      <button class="app prime" data-app="Prime Video">prime<br>video</button>
      <button class="app youtube" data-app="YouTube"><b>▶</b> YouTube</button>
    </section>

    <div class="divider"></div>

    <section class="quick-grid">
      <div class="quick-card">
        <span class="label">VOL</span>
        <button class="round" data-key="KEY_VOLUP">＋</button>
        <button class="round" data-key="KEY_MUTE">⌁</button>
        <button class="round" data-key="KEY_VOLDOWN">−</button>
      </div>
      <div class="quick-card">
        <span class="label">CH</span>
        <button class="round" data-key="KEY_CHUP">⌃</button>
        <button class="round" data-key="KEY_GUIDE">▤</button>
        <button class="round" data-key="KEY_CHDOWN">⌄</button>
      </div>
    </section>

    <div class="dots"><i></i><i class="on"></i><i></i><b>＋</b></div>

    <section class="nav-panel">
      <div class="panel-top">
        <button class="small" data-key="KEY_SOURCE">□</button>
        <button class="numbers" id="numbers">123</button>
      </div>
      <div class="dpad">
        <button class="dpad-key up" data-key="KEY_UP">⌃</button>
        <button class="dpad-key left" data-key="KEY_LEFT">‹</button>
        <button class="ok" data-key="KEY_ENTER"></button>
        <button class="dpad-key right" data-key="KEY_RIGHT">›</button>
        <button class="dpad-key down" data-key="KEY_DOWN">⌄</button>
      </div>
      <div class="bottom">
        <button class="bottom-key" data-key="KEY_RETURN">↶</button>
        <button class="bottom-key home" data-key="KEY_HOME">⌂</button>
        <button class="bottom-key" id="voice">♩</button>
      </div>
    </section>

    <section class="number-pad hidden" id="numberPad">
      <button data-key="KEY_1">1</button><button data-key="KEY_2">2</button><button data-key="KEY_3">3</button>
      <button data-key="KEY_4">4</button><button data-key="KEY_5">5</button><button data-key="KEY_6">6</button>
      <button data-key="KEY_7">7</button><button data-key="KEY_8">8</button><button data-key="KEY_9">9</button>
      <button data-key="KEY_PRECH">↶</button><button data-key="KEY_0">0</button><button data-key="KEY_ENTER">OK</button>
    </section>

    <div class="toast" id="toast"></div>
  </main>

  <dialog id="setup">
    <form method="dialog" class="setup-card">
      <h2>Connect Samsung TV</h2>
      <p>Phone and TV must be on the same Wi‑Fi network.</p>
      <label>TV IP address
        <input id="tvIp" placeholder="192.168.1.50" inputmode="decimal">
      </label>
      <label>Device name
        <input id="deviceName" value="Crystal Remote">
      </label>
      <button class="connect-btn" id="connectBtn" value="default">Connect</button>
      <small id="setupStatus">First connection will ask you to Allow this remote on the TV.</small>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
